n').forEach((b,j)=>b.classList.toggle('active',j===i));if(play)v.play().catch(()=>{})}clips.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i?c.title.split(' · ')[0]:'Montage';b.onclick=()=>pick(i,true);document.getElementById('nav').append(b)});pick(0);</script></html>
