<script>const slides=[{"id": "01", "start": 0, "duration": 10, "section": "The idea", "title": "Improve the skill. Keep what works.", "narration": "A robot can position an object correctly, yet fail at release. CAST improves the skill while preserving behavior that already works.", "slots": [], "sources": ["sections/01_introduction.tex"], "image": "previews/slide-01.png", "media": []}, {"id": "02", "start": 10, "duration": 20, "section": "Why anchoring matters", "title": "Small steps can still drift.", "narration": "A critic predicts which actions are valuable. Here, its predictions favor actions far from the useful region. Watch the action distributions shift during optimization. Clipping keeps each correction small, but repeated corrections still drift. CAST restores toward the frozen base while allowing a useful adjustment. This is an illustrative toy example.", "slots": ["A01"], "sources": ["sections/03_problem_statement.tex", "sections/04_analysis.tex"], "image": "previews/slide-02.png", "media": [{"id": "A01", "slide": 2, "kind": "animation", "title": "Accumulated drift", "brief": "Animate matched synthetic actions with clipping alone versus the exact CAST restoration and caps. Same base, critic, and step cap.", "filename": "animations/A01_accumulated_drift.mp4", "slide_start_seconds": 10, "slide_duration_seconds": 20, "box_points": [42, 153, 604, 339], "box_inches": [0.58333, 2.125, 8.38889, 4.70833], "suggested_pixels": [1208, 678], "pptx_shape_name": "MEDIA_A01_FRAME", "status": "completed; embedded MP4 with poster", "poster": "animations/posters/A01_accumulated_drift.png", "playback_box_points": [42.666666666666686, 153.0, 602.6666666666666, 339.0], "pptx_video_shape_name": "MEDIA_A01_VIDEO"}]}, {"id": "03", "start": 30, "duration": 15, "section": "Policy architecture", "title": "Freeze the base. Learn a correction.", "narration": "We freeze the generative policy and learn an additive residual. The same observation and noise pair each current action with its base action, giving corrections a consistent reference without policy likelihoods.", "slots": ["A02"], "sources": ["sections/03_problem_statement.tex", "sections/04_method.tex"], "image": "previews/slide-03.png", "media": [{"id": "A02", "slide": 3, "kind": "animation", "title": "Paired residual actions", "brief": "Reveal base actions and learned residual arrows for the same noise samples. Keep the base fixed.", "filename": "animations/A02_paired_residuals.mp4", "slide_start_seconds": 30, "slide_duration_seconds": 15, "box_points": [468, 159, 450, 304], "box_inches": [6.5, 2.20833, 6.25, 4.22222], "suggested_pixels": [900, 608], "pptx_shape_name": "MEDIA_A02_FRAME", "status": "completed; embedded MP4 with poster", "poster": "animations/posters/A02_paired_residuals.png", "playback_box_points": [468.0, 184.4375, 450.0, 253.125], "pptx_video_shape_name": "MEDIA_A02_VIDEO"}]}, {"id": "04", "start": 45, "duration": 25, "section": "Construct the target", "title": "Propose. Restore. Limit the step.", "narration": "First, the critic proposes an improvement. We normalize and cap its gradient, then scale the proposal. A weak pull always points toward the paired base action. Beyond a soft reference radius, an additional radial pull becomes active. We add these fields and cap the final step from the current action. The resulting target teaches the residual policy.", "slots": ["A03"], "sources": ["sections/04_method.tex"], "image": "previews/slide-04.png", "media": [{"id": "A03", "slide": 4, "kind": "animation", "title": "Construct the action target", "brief": "Animate the normalized critic proposal, paired weak/radial restoration, and combined displacement cap. Restoration is evaluated at the current action.", "filename": "animations/A03_cast_update.mp4", "slide_start_seconds": 45, "slide_duration_seconds": 25, "box_points": [342, 145, 576, 324], "box_inches": [4.75, 2.01389, 8.0, 4.5], "suggested_pixels": [1152, 648], "pptx_shape_name": "MEDIA_A03_FRAME", "status": "completed; embedded MP4 with poster", "poster": "animations/posters/A03_cast_update.png", "playback_box_points": [342.0, 145.0, 576.0, 324.0], "pptx_video_shape_name": "MEDIA_A03_VIDEO"}]}, {"id": "05", "start": 70, "duration": 22, "section": "Learn and repeat", "title": "A soft reference, learned through fixed targets.", "narration": "The squares are fixed targets. The white actor learns to match them by regression; its fitting error decreases. Then we construct new targets and repeat. Restoration corresponds to a penalty on departure from the base. With clipping inactive, the first regression gradient follows regularized critic optimization. The reference stays soft, leaving room to improve.", "slots": ["A04"], "sources": ["sections/04_method.tex", "sections/04_analysis.tex"], "image": "previews/slide-05.png", "media": [{"id": "A04", "slide": 5, "kind": "animation", "title": "Fit \u2192 refresh targets", "brief": "Show fixed targets during regression; move the actor toward them, then recompute. Illustrate the soft restoration potential without claiming a hard policy-output bound.", "filename": "animations/A04_regress_refresh.mp4", "slide_start_seconds": 70, "slide_duration_seconds": 22, "box_points": [42, 150, 494, 292], "box_inches": [0.58333, 2.08333, 6.86111, 4.05556], "suggested_pixels": [988, 584], "pptx_shape_name": "MEDIA_A04_FRAME", "status": "completed; embedded MP4 with poster", "poster": "animations/posters/A04_regress_refresh.png", "playback_box_points": [42.0, 157.0625, 494.0, 277.875], "pptx_video_shape_name": "MEDIA_A04_VIDEO"}]}, {"id": "06", "start": 92, "duration": 28, "section": "Simulation evidence", "title": "Reach useful performance with less experience.", "narration": "On robomimic square, CAST reaches ninety percent success with thirty-eight percent fewer environment steps than DICE-RL, while final success is similar. In a separate five-task LIBERO study, both updates without restoration lose all task success, including clipping alone. Full CAST improves every task over its base, although radial restoration alone is better on two tasks.", "slots": ["A05"], "sources": ["sections/05_experiments.tex", "sections/tables/05_ablations.tex", "figures/experiment_chart_data.json"], "image": "previews/slide-06.png", "media": [{"id": "A05", "slide": 6, "kind": "animation", "title": "Measured restoration ablation", "brief": "Animate equal-status bars for the base and four component configurations using the five-task mean success from the submitted paper. This is an aggregate comparison, not a learning curve.", "filename": "animations/A05_measured_learning_progress.mp4", "slide_start_seconds": 92, "slide_duration_seconds": 28, "box_points": [42, 147, 463, 303], "box_inches": [0.58333, 2.04167, 6.43056, 4.20833], "suggested_pixels": [926, 606], "pptx_shape_name": "MEDIA_A05_FRAME", "status": "completed; embedded MP4 with poster", "poster": "animations/posters/A05_measured_learning_progress.png", "playback_box_points": [42.0, 168.28125, 463.0, 260.4375], "pptx_video_shape_name": "MEDIA_A05_VIDEO"}]}, {"id": "07", "start": 120, "duration": 16, "section": "Real robot \u2014 setup", "title": "From recorded experience to robot execution.", "narration": "We evaluate OpenArm with chest and wrist cameras, joint state, and a parallel gripper. A flow-matching policy predicts action chunks. Refinement trains offline on recorded successes and failures, then we evaluate placement and stacking autonomously on a staircase scene.", "slots": [], "sources": ["sections/05_real_robot.tex", "sections/05_experimental_supplement.tex"], "image": "previews/slide-07.png", "media": []}, {"id": "08", "start": 136, "duration": 16, "section": "Real robot \u2014 placement", "title": "Place accurately across changing heights.", "narration": "Placement requires putting the toy fully inside the case. CAST raises success from fifty-five to ninety-five percent, compared with eighty percent for BC refinement and ninety percent for DICE-RL, all starting from the same base.", "slots": ["V01"], "sources": ["sections/05_real_robot.tex", "real_robot_results.json"], "image": "previews/slide-08.png", "media": []}, {"id": "09", "start": 152, "duration": 20, "section": "Real robot \u2014 stacking", "title": "Preserve the approach. Improve the finish.", "narration": "Stacking requires alignment and a clean release. A common observed failure is reaching the correct position without releasing the cube. The failed outcome does not mean every preceding action was wrong. CAST reaches seventy percent success, versus thirty-five for the base, sixty-five for BC refinement, and sixty for DICE-RL.", "slots": ["V02"], "sources": ["sections/05_real_robot.tex", "real_robot_results.json"], "image": "previews/slide-09.png", "media": []}, {"id": "10", "start": 172, "duration": 8, "section": "Takeaway", "title": "Improve the skill. Keep a persistent reference.", "narration": "CAST combines critic guidance, soft restoration, and bounded target steps: improve the skill while keeping a persistent reference.", "slots": [], "sources": ["sections/06_conclusion.tex"], "image": "previews/slide-10.png", "media": []}];let index=0,elapsed=0,playing=false,last=performance.now();const $=id=>document.getElementById(id);const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${s.id} · ${s.section}`;$('jump').append(o)});
function sync(force=false){const local=elapsed-slides[index].start;document.querySelectorAll('#stage video').forEach(v=>{if(v.readyState>=1){const target=Math.max(0,Math.min(local,v.duration-0.01));if(force||Math.abs(v.currentTime-target)>.3)v.currentTime=target;if(playing&&local<v.duration){if(v.paused)v.play().catch(()=>{})}else v.pause()}})}
function show(i){index=Math.max(0,Math.min(slides.length-1,i));const s=slides[index];document.querySelectorAll('#stage video').forEach(v=>{v.pause();v.remove()});$('slide').src=s.image;$('slide').alt=s.title;$('title').textContent=`${fmt(s.start)}–${fmt(s.start+s.duration)} · ${s.title}`;$('script').textContent=s.narration;$('cue').textContent=s.media.length?'Playing: '+s.media.map(m=>m.id+' — '+m.title).join('; '):s.slots.length?'Autonomous footage reserved; current image is a labeled demonstration still.':'Static slide.';$('jump').value=index;for(const m of s.media){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=m.filename;v.poster=m.poster;v.dataset.id=m.id;const [x,y,w,h]=m.playback_box_points;Object.assign(v.style,{left:x/960*100+'%',top:y/540*100+'%',width:w/960*100+'%',height:h/540*100+'%'});v.onloadedmetadata=()=>sync(true);$('stage').append(v)}clock();sync(true)}
function clock(){$('clock').textContent=`${fmt(elapsed)} / 03:00`;$('scrub').value=elapsed}
function seek(t){elapsed=Math.max(0,Math.min(180,t));let i=slides.findIndex(s=>elapsed<s.start+s.duration);if(i<0)i=slides.length-1;if(i!==index)show(i);else sync(true);clock();last=performance.now()}
function go(i){seek(slides[Math.max(0,Math.min(slides.length-1,i))].start)}
function toggle(){if(elapsed>=180)seek(0);playing=!playing;$('play').textContent=playing?'Pause':'Play 3-minute preview';sync(true);last=performance.now()}
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('play').onclick=toggle;$('jump').onchange=e=>go(+e.target.value);$('scrub').oninput=e=>seek(+e.target.value);$('toggle').onclick=()=>{$('notes').hidden=!$('notes').hidden;$('toggle').textContent=$('notes').hidden?'Show notes':'Hide notes'};$('focus').onclick=()=>document.body.classList.add('focus');
window.onkeydown=e=>{if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key==='Escape')document.body.classList.remove('focus')};
function tick(now){if(playing){elapsed=Math.min(180,elapsed+(now-last)/1000);let i=slides.findIndex(s=>elapsed<s.start+s.duration);if(i<0)i=slides.length-1;if(i!==index)show(i);sync();clock();if(elapsed>=180){playing=false;sync();$('play').textContent='Replay'}}last=now;requestAnimationFrame(tick)}show(0);requestAnimationFrame(tick);
</script></body></html>
